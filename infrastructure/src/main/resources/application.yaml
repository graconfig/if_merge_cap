spring:
  application:
    name: ifmerge-cap
  main:
    banner-mode: console

server:
  port: 8080

ifmerge:
  # AI Gateway は SAP AI Core（実）のみ。env 方式：凭证明文 + 環境変数で上書き可。
  ai:
    auth-url: https://genai-europe-aws-16rxv3mh.authentication.eu10.hana.ondemand.com
    client-id: 'sb-4ba914fb-04d8-406b-ac7c-42a33bcc8f89!b549118|aicore!b540'
    client-secret: '30c733f4-1d27-4891-9633-c3125e0296a6$59d5zVVBHoXVGk_T-A5CAhelitpx5XkOYImEmubfp0w='
    base-url: https://api.ai.prod.eu-central-1.aws.ml.hana.ondemand.com/v2
    resource-group: default
    # model-name と deployment-id 二选一：model-name 优先（动的解析）
    model-name: claude-4.6-sonnet
    deployment-id: ""
    # LLM 调用参数（与原 Python 一致）
    analysis-temperature: 0.3
    analysis-max-tokens: 16384
    generation-temperature: 0.7
    generation-max-tokens: 8192
  # セキュリティ：dev 既定 permitAll、本番（prod profile）では false で XSUAA JWT 必須
  security:
    permitAll: ${IFMERGE_SECURITY_PERMITALL:true}
  analysis:
    phase1HeadRows: 30
    maxChunkRows: 100
    timeout: 5m
  merge:
    defaultThreshold: 0.80
    defaultMode: max
  job:
    ttl: 15m
    cleanupInterval: 600000   # 10 分 (ms)
    maxConcurrent: 10
    # RUNNING/PENDING のまま放置された Job を強制 FAILED にする閾値（メモリリーク防止）
    runningTimeout: 10m
  prompts:
    path: classpath:prompts.yaml

resilience4j:
  retry:
    instances:
      sap-ai-core:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        # サーキットブレーカが OPEN の時は即失敗させ、無駄なリトライをしない
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  circuitbreaker:
    instances:
      sap-ai-core:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    console: '%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
  level:
    com.handjapan.ifmerge: INFO
    com.sap.cds: WARN
    org.springframework.web: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
---
management:
  endpoint:
    health:
      show-components: always
      probes.enabled: true
  endpoints:
    web:
      exposure:
        include: health
  health:
    defaults.enabled: false
    ping.enabled: true
    db.enabled: true
