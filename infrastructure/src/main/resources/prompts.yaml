# AI プロンプトテンプレート
# 原 Python 工程の prompts.yaml と書式互換。
# 占位符は {var_name} 形式（例：{file_name}, {sheet_head_text}）。
#
# 編集後の反映には再起動が必要。
# エントリ削除時は内蔵プロンプトにフォールバック（YamlPromptRepository 参照）。

phase1:
  template: |
    以下はSAP Interface設計書（{file_name}）の各シートの先頭部分です。
    各行の各セルは [列番号]値 の形式で表示されています。

    {sheet_head_text}

    以下を識別してください：
    1. document_number: 文書管理番号（例: BDN-EPD-OF-093）
    2. if_name: インターフェース名称
    3. data_sheets: EBSテーブルの項目一覧が記載されているシートのみ
       （「エクスポート項目」「インポート項目」「データ項目」等。
        「表紙」「処理概要」「変更履歴」「テーブル一覧」等は除外すること）
    4. 各データシートについて：
       - data_start_row: データ行（項目一覧）が始まる行番号（0始まり）
       - col_table_name: EBSテーブル名（日本語）が入っている列番号（不明な場合は-1）
       - col_table_id: EBSテーブルID（英語）が入っている列番号
       - col_item_id: 項目ID（英語カラム名）が入っている列番号
       - col_digit: 桁数（バイト長）が入っている列番号（不明な場合は-1）

    extract_doc_metaツールを使って結果を返してください。

phase2:
  template: |
    以下はSAP Interface設計書（{file_name}）のデータ行の一部です。
    各セルは [列番号]値 の形式で表示されています。

    固定情報（全行共通）：
    - 文書管理番号: {doc_number}
    - IF名: {if_name}

    データ行：
    {chunk_text}

    上記のデータ行から、各項目を抽出してください。抽出できない情報は空でよい：
    1. ebs_table_name: EBSテーブルの日本語名称
    2. ebs_table_id: EBSテーブルの英語ID
    3. item_id: 各項目の英語ID/カラム名
    4. item_name: 各項目の日本語名称
    5. digit_count: 各項目の桁数
    6. item_description: 項目の詳細説明（備考欄や説明欄から取得）
    7. data_type: データ型（VARCHAR2, NUMBER, DATE等）
    8. digit_decimal: 桁数（小数点以下）
    9. dev_type: 標準/追加開発
    10. is_key: キー項目（●など）
    11. required: 必須/任意
    12. remarks: 備考

    重要なルール：
    - 一セルに複数行の項目が記載されている場合は、それぞれ分割して出力すること。
    - 項目ID（英語カラム名）を1つずつ漏れなく抽出すること。
    - 同じNo（番号）に複数の項目IDが属している場合（No列が空白で続く行）は、1行にまとめること：
      * 項目ID: カンマ区切りで連結
      * 項目名: カンマ区切りで連結
      * 桁数: カンマ区切りで連結
    - EBSテーブル名/IDはデータ行から読み取ること。途中で変わる場合は変わった後の値を使用。
    - IF項目のみを出力すること。処理概要などの説明行は出力しないこと。
    - 文書管理番号とIF名は上記の固定情報をそのまま使用すること。
    - セル内のノイズ除去ルール：
      * 【履歴管理】およびそれ以降の文字列（番号・記号・丸数字含む）はすべて除去すること（例: 「契約情報　【履歴管理】④」→「契約情報」）
      * [Vx.xx]形式のバージョン番号は除去すること（例: 「TAX代替ビュー(ID)  [V1.09]」→「TAX代替ビュー(ID)」）
      * セルに「×」「＊」「*」などの演算記号が含まれる場合、その記号より前の英語ID部分のみを使用すること（例: 「TAX_RATE  ×  0.01」→「TAX_RATE」）
      * 項目IDセルの値が演算記号のみ、または演算記号で始まる場合（英語IDが含まれない場合）はその行をスキップすること

    extract_interface_infoツールを使って結果を返してください。

classify_interfaces:
  template: |
    以下の{count}個の日本語インターフェース（IF）を分析し、
    SAPモジュールと業務シナリオに基づいてグループ化してください。

    インターフェース情報：
    {if_info_block}
    以下の観点でインターフェースをグループ化してください：
    1. SAPモジュール（例：SD、MM、PP、WM、FI、CO、HRなど）
    2. 業務シナリオ（例：受注処理、在庫管理、出荷管理、購買管理など）

    グループ化要件：
    - 各インターフェースは1つのグループにのみ属する
    - SAPモジュールと業務シナリオを別々のフィールドで指定
    - **モジュール名は必ず単一のSAPモジュールコードのみを指定すること（例：「SD」「MM」「WM」）。複数モジュールの組み合わせ（例：「SD/WM」「SD_WM」）は絶対に使用しないこと**
    - インターフェースが複数モジュールにまたがる場合は、最も主要なモジュールを1つ選択すること
    - 明確に分類できない場合は、module: "その他"、scenario: "未分類"を使用

    classify_interfacesツールを使用して分類結果を返してください。

generate_all_if_info:
  template: |
    以下の{count}個の日本語インターフェース（IF）の情報を分析し、
    各インターフェースの概要を生成し、代表項目名を選択してください。

    インターフェース情報：
    {if_info_block}
    提供されたツールを使用して、各インターフェースの情報を生成してください。要件：

    1. IF概要：日本語で簡潔な機能説明を生成（30-50文字）、インターフェースの主な機能と用途を要約

    2. 代表項目名：各インターフェースの項目総数の約20%に相当する代表的な項目名を選択してください。選択基準：
       ① SAP系統における重要性：項目名がSAPシステムで一般的に使用されるキー項目（例：伝票番号、品目コード、顧客コード、注文番号、会計年度、会社コード、プラントコード、在庫組織、勘定科目など）であるかを優先的に考慮
       ② 業務シナリオとの関連性：IF名から推測される業務シナリオにおいて、最も代表的で重要な項目を選択（例：「出荷指示」というIF名の場合、出荷関連の項目を優先）

       選択した項目名をカンマで区切って返してください（例：項目総数が50個の場合、約10個の項目名を選択）

    generate_all_if_infoツールを呼び出して、すべてのインターフェースの情報を一度に返してください。

generate_merged_if_name:
  template: |
    以下のマージ対象インターフェース情報に基づいて、
    新しい簡潔な日本語インターフェース名を生成してください（20-40文字）：

    {if_info_block}

    要件：
    1. 名前はすべてのインターフェースの共通機能を要約すること
    2. 日本語を使用すること
    3. 専門的かつ簡潔であること

    generate_merged_nameツールを使用して新しいインターフェース名を返してください。
