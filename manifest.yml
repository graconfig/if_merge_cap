# ───────────────────────────────────────────────────────────────
# MTA を使わない簡易デプロイ（cf push）用。MTA 版（mta.yaml）が本命。
#
# 前提（先に1回だけ）：
#   1) ビルド:    mvn -B clean package -DskipTests
#   2) XSUAA作成: cf create-service xsuaa application ifmerge-xsuaa -c xs-security.json
#
# デプロイ：
#   cf push
#   （AI Core 凭证は下の env に明文で含まれるため、追加注入は不要）
# ───────────────────────────────────────────────────────────────
applications:
  - name: ifmerge-cap-srv
    path: infrastructure/target/ifmerge-cap-srv-exec.jar
    memory: 1024M
    disk_quota: 1024M
    buildpacks:
      - java_buildpack          # 代替: sap_java_buildpack
    health-check-type: http
    health-check-http-endpoint: /actuator/health
    services:
      - ifmerge-xsuaa
    env:
      JBP_CONFIG_OPEN_JDK_JRE: "{ jre: { version: 17.+ } }"
      # prod プロファイル有効化（permitAll=false は application-prod.yaml が担当）
      SPRING_PROFILES_ACTIVE: prod
      # フラットな独立環境変数（凭证明文）
      IFMERGE_AI_AUTH_URL: "https://genai-europe-aws-16rxv3mh.authentication.eu10.hana.ondemand.com"
      IFMERGE_AI_BASE_URL: "https://api.ai.prod.eu-central-1.aws.ml.hana.ondemand.com/v2"
      IFMERGE_AI_RESOURCE_GROUP: "default"
      IFMERGE_AI_MODEL_NAME: "claude-4.6-sonnet"
      IFMERGE_AI_CLIENT_ID: "sb-4ba914fb-04d8-406b-ac7c-42a33bcc8f89!b549118|aicore!b540"
      IFMERGE_AI_CLIENT_SECRET: "30c733f4-1d27-4891-9633-c3125e0296a6$59d5zVVBHoXVGk_T-A5CAhelitpx5XkOYImEmubfp0w="
